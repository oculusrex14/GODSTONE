# GMP/2 wire format -- the SINGLE source of truth.
#
# Android and iOS codecs are GENERATED from this file. Hand-editing either
# generated file makes ci/check_parity.py Invariant A go red. "Byte-for-byte
# identical" stops being a comment and becomes a build assertion.
#
# WHY v2 EXISTS
# -------------
# v1 shipped two incompatible layouts that each claimed to be the other:
#     Android  20-byte header, 8-byte msg_id,  types 0x01..0x0A
#     iOS      26-byte header, 16-byte msg_id, types 0x01..0x08
# They failed at three independent layers -- different BLE service UUIDs meant
# they never discovered each other; different header sizes meant every frame
# failed to parse; and overlapping type codes meant an Android DIGEST (0x02)
# would have been read by iOS as an SOS.
#
# v2 is a strict superset of both. Android's `priority` and iOS's `routingTag`
# both survive; msg_id takes iOS's 16-byte width.

version: 2
magic: 0x4753          # "GS"
header_size: 32

header:
  - {name: magic,       offset: 0,  size: 2,  type: u16, note: "0x4753, fail-closed sentinel"}
  - {name: version,     offset: 2,  size: 1,  type: u8,  note: "0x02"}
  - {name: type,        offset: 3,  size: 1,  type: u8,  note: "see message_types"}
  - {name: msg_id,      offset: 4,  size: 16, type: bytes, note: "BLAKE2s-128"}
  - {name: routing_tag, offset: 20, size: 4,  type: bytes, note: "rotates daily"}
  - {name: ttl,         offset: 24, size: 1,  type: u8,  note: "initial 12, max 16"}
  - {name: hop_count,   offset: 25, size: 1,  type: u8,  note: "increments on relay"}
  - {name: flags,       offset: 26, size: 2,  type: u16}
  - {name: payload_len, offset: 28, size: 2,  type: u16, note: "max 60000"}
  - {name: header_crc,  offset: 30, size: 2,  type: u16, note: "CRC-16/CCITT over 0..29"}

# THE SINGLE BLE SERVICE UUID. v1's partition was three defects, and this was
# the first: Android advertised 67640001-… while iOS scanned 6F0D0001-…, so the
# two never discovered each other and the header/type defects were never even
# reached. Generated into both platforms so they CANNOT drift again.
ble:
  service_uuid:   "6764A001-9A5E-4C7B-B0A1-3E5D8C2F7A10"
  inbox_uuid:     "6764A002-9A5E-4C7B-B0A1-3E5D8C2F7A10"
  digest_uuid:    "6764A003-9A5E-4C7B-B0A1-3E5D8C2F7A10"
  link_info_uuid: "6764A004-9A5E-4C7B-B0A1-3E5D8C2F7A10"

byte_order: big
max_payload: 60000
default_ttl: 12
max_ttl: 16

# EVERY code has EVEN parity (even popcount). This is a structural guarantee,
# not hand-picked luck: any single-bit flip changes parity and therefore lands
# on a code that cannot exist, so pairwise Hamming distance is >= 2 BY
# CONSTRUCTION. codegen.py verifies parity, pairwise distance and the v1
# non-reuse rule, and refuses to emit if any of them breaks.
#
# The first draft of this table had SOS=0x64 one bit from WANT=0x24 -- a single
# flip would have fabricated a distress broadcast, the exact property this
# section claims to provide. The checker caught it. Hand-chosen codes are not
# trustworthy; the parity rule is.
#
# Renumbered so no v2 code reuses any v1 value (v1 used 0x01..0x0A on both
# platforms). A stray legacy frame now hits the unknown-type branch and is
# dropped, instead of a DIGEST arriving as an SOS.
message_types:
  HELLO:      0x11
  DIGEST:     0x12
  WANT:       0x14
  MESSAGE:    0x18
  ACK:        0x21
  BULK_OFFER: 0x22
  BULK_CHUNK: 0x24
  PING:       0x28
  GOODBYE:    0x41
  SOS:        0xF0

flags:
  SEALED:     0x0001
  COMPRESSED: 0x0002
  FRAGMENTED: 0x0004
  HAS_POW:    0x0008
  ACK_REQ:    0x0010
  RELAY_OK:   0x0020
  # ADR-001 s.3.1: 0x00C0 is TWO bits = 4 values, and the priority set below
  # has FIVE. GMP/2 could not encode Android's existing priorities at all.
  # Widened to three bits (8 values). codegen.py now asserts the mask is wide
  # enough for the priority table, so this fails the build, not the mesh.
  PRIORITY_MASK: 0x0700

priority:
  SOS:       0
  DIRECT:    1
  GROUP:     2
  BROADCAST: 3
  BULK:      4

# Defence in depth. The renumbering stops a legacy frame being MISREAD as an
# SOS; these requirements stop a corrupted or truncated frame FABRICATING one.
# That second property is worth more than the renumbering.
sos_requirements:
  payload_magic: "SOS1"
  required_flags: [ACK_REQ, RELAY_OK]
  signature: ed25519
  signature_len: 64
  # T38 (ADR-005 amendment): the one signed-SOS envelope, byte canon shared by
  # both isles. The keys above stay FOREVER as the structural gate records
  # them; the keys below state the cryptographic canon that the hand-written
  # runtime helpers SignedSosV1.{kt,swift} realise on top of the frozen
  # authorities (MessageId.derive, IdentityBindingV1, Ed25519). They are
  # documentation for the courts and the roster; codegen reads the structural
  # keys only, so the generated tables do not shift.
  payload_layout: >
    frame.payload = ASCII("SOS1") || signature(64) || unsigned payload;
    unsigned payload = version(1)=0x01 || identityBinding(133) ||
    created_at(4, little-endian) || time_quality(1) || message_nonce(16) ||
    body_len(2, big-endian) || body (UTF-8, at most 400 octets, strict).
  signature_transcript: >
    signature = Ed25519(signing seed, msg_id || ASCII("SOS1") || unsigned
    payload). The signature covers the magic AND the unsigned span; the
    identity binding embedded in the unsigned span is the T13 serialization
    (version || generation big-endian || signing pub || static DH pub ||
    binding signature) whose 80-octet preimage runs under the GMP2-IDBIND
    domain, and the sender node id is BLAKE2s-128 of the embedded signing
    key -- derived, never trusted.
  msg_id_over: >
    msg_id = MessageId.derive(sender node id, created_at, message nonce,
    UNSIGNED payload). The frozen formula runs over the unsigned span only;
    the signature slot is never hashed into the id that it signs.
  vectors: crypto/sos_v1_vectors.json
  structural_fixture_law: >
    Signed-SOS vectors and structural zero-signature golden SOS fixtures are
    SEPARATE families. The structural fixtures (including every golden_vectors
    SOS entry, whose signature slot is 64 zero octets) remain structural
    validation material and are never proof of signature validity.
  runtime_auth_law: >
    An SOS is authenticated, not merely validated: the receiving runtime
    (SignedSosV1.verify) refuses the zero-signature fixtures by name; an
    unauthenticated frame never reaches a distress consumer, never moves
    trust or approval state, and the relay decision is computed first and
    returned untouched -- refusal to authenticate is a verdict about the
    indication, never about the frame's epidemic duty.
  note: >
    An SOS must carry the payload magic, both flags, and a valid Ed25519
    signature over msg_id || ASCII("SOS1") || UNSIGNED payload, struck under
    the key bound by its identity binding. A parse error can no longer
    fabricate a distress broadcast.

# T40 (ADR-009): the anti-entropy control-plane payload scope freeze.
# Codegen reads the structural keys above only -- the generated tables do not
# shift; this section is the law the hand-written control codecs
# (router.ControlPayloadV1.kt / ControlPayloadV1.swift) and the per-relation
# owner (SyncControlOwner) realise on top of the frozen envelope. The one
# independent reference is wire/anti_entropy_reference.py; the vectors are
# struck by crypto/gen_anti_entropy_vectors.py from crypto/gmp21.py alone.
control_payloads:
  version: 1                       # every control payload begins with this u8
  arms: [digest, want, inventory_request, inventory_page, reset, ping]
  typecodes:                       # frozen outer codes; NO new outer codes
    digest: 0x12
    want: 0x14
    inventory_request: 0x11        # HELLO subtype 1
    inventory_page: 0x11           # HELLO subtype 2
    reset: 0x11                    # HELLO subtype 3
    ping: 0x28
  layouts:
    digest: "version u8(1) || snapshotId u64_be (nonzero) || bloom[512]"
    want: >
      version u8(1) || snapshotId u64_be (nonzero) || count u8 (1..32) ||
      msgID[count][16]; ids distinct; applies only to the current sync
      snapshot; split as required by writer capacity (ATT value 20).
    inventory_request: >
      version u8(1) || u8(1) || snapshotId u64_be || cursorPresent u8 ||
      cursor[16]; cursorPresent=0 denotes the start and requires the all-zero
      filler; cursorPresent=1 permits every 16-byte id including all-zero;
      cursors are exclusive lexicographic last-seen msgIDs, not SQL offsets.
    inventory_page: >
      version u8(1) || u8(2) || snapshotId u64_be || done u8 || count u8 ||
      msgID[count][16]; maximum 32 ids per page; count 0 is allowed only with
      done=1.
    reset: "version u8(1) || u8(3) || newSnapshotId u64_be (nonzero)"
    ping: >
      version u8(1) || reply u8 (0..1) || nonce u64_be; a request is answered
      by one reply echoing the nonce; a reply is never answered; the nonce is
      the relation's replay discriminator and its monotonic pair the RTT
      sample (ADR-009 records this, the one field the frozen table left open).
  typed_failures: [truncated, wrong_size, unsupported_version, count_out_of_range,
                   duplicate_ids, bad_cursor, bad_done, bad_reply, zero_snapshot_id,
                   unknown_subtype, sequence_break]
  envelope_law: >
    Control frames ride the trusted encrypted link inside DATA records, never
    raw GATT plaintext; flags, ttl and hop_count carry control-only zero
    values; a ttl-0 control frame is local to the authenticated link, is never
    forwarded, and never enters the generic message expiration; control frames
    never enter held message storage.
  dispatch_law: >
    decoded PING/HELLO/DIGEST/WANT go to the per-relation sync/control owner
    before the generic Router TTL/dedup/storage; ACK goes to the ACK
    dispatcher; only supported MESSAGE/SOS enter durable message routing;
    unknown or bulk control types are rejected in this profile.
  snapshot_law: >
    the authority (the store executor) builds the stable immutable sorted id
    vector from a consistent short read transaction, bounded by 100000 rows
    and 1.6MiB of ids; snapshotId is a nonzero monotonic u64 allocated by the
    context (exhaustion retires the context); at most two snapshots are
    shared (current and one referenced predecessor), maximum age five
    minutes; at most one new build per thirty seconds under a two-second
    read-transaction budget -- abort safely when the budget breaks; pages are
    pinned to the captured vector, never to a changing SQL offset; a
    consumer requesting a stale snapshot receives the reset subtype plus the
    current digest and restarts with cursorPresent=0; ordinary new holds do
    not restart an active immutable snapshot; control state and producer
    leases release on relation terminal.
  sync_run_budget:
    max_pages_per_run: 64
    max_wants_per_run: 256
    periodic_inventory_ms: 300000
  bloom_law: >
    the canonical bit index is
    ((BE64(BLAKE2s64(msgID16 || round u32_be)) >> 1) & 0x7fffffff) % 4096
    for rounds 0..3 -- crypto/gmp21.py is the authority; do not simplify the
    formula to a raw modulo 4096 from stale comments. The LinkInfo six-byte
    digest stays a short change hint only; the full 512-byte bloom travels in
    the DIGEST payload.
  vectors: crypto/anti_entropy_vectors.json
  semantic_negative_law: >
    a digest built from seen-but-not-held ids, or an exact-ID reconciliation
    that is disabled, must fail the eviction and collision tests: the bloom
    may suppress, the walk must never lie.
