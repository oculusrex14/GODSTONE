android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableJetifier=false
# *** GS-FINAL-003 `same-estate`: THE HOST PLATFORM SEAM IS SHARED THROUGH TEST FIXTURES. ***
#
# *The `:labmesh` JVM courts must compose the LAUNCHABLE lab application over a host platform that substitutes ONLY the
# two doors a JVM lacks (the AndroidKeyStore identity factory and the SQLCipher native engine), supplying its OWN real
# on-disk SQLite via the SAME `JdbcStoreDb`/`JdbcPeerIdentityStore` the `:mesh` courts already drive -- never a copy.*
# **AGP 8.5+ exposes a `testFixtures` source set to consuming modules only when Kotlin support is opted in, which is
# what maketh "one host platform, two courts" a fact about the build graph rather than a duplicated file.**
android.experimental.enableTestFixturesKotlinSupport=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
