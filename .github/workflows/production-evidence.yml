name: production-evidence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python ci/check_repository.py
      - run: python -m unittest discover -s content/tests -v
      - run: python ci/no_legacy_wire.py --selftest

  android-light:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f android/gradle/wrapper/gradle-wrapper.jar
      - run: cd android && ./gradlew --no-daemon --warning-mode=all clean test lint assembleLightRelease bundleLightRelease
      - run: python scripts/inspect_android_artifacts.py android/app/build artifacts/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-light-unsigned
          path: artifacts/android
          if-no-files-found: error

  ios-foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Drift gate: the committed ios/Packages/GodstoneFoundation tree must be
      # byte-identical to what sync_ios_foundation_package.py would regenerate
      # from the authoritative ios/Godstone sources. Running the script in
      # --check mode (not destructive sync) means CI FAILS if a contributor
      # edits the generated copy directly, or edits canonical Core/Mesh without
      # re-running sync and committing the regenerated tree. The committed tree
      # is the tested artifact; it is never silently overwritten in CI.
      - run: python scripts/sync_ios_foundation_package.py --check
      - run: swift test --package-path ios/Packages/GodstoneFoundation
      - run: xcodegen generate --spec ios/project.yml
      - run: >-
          xcodebuild -project ios/Godstone.xcodeproj -scheme Godstone-Light
          -configuration LightRelease -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
