name: release-gates

# Fail-closed EXTERNAL gates that repository-verification deliberately does NOT
# run, because they depend on inputs that are not in the repo and must not be
# manufactured into a false green: an approved independent Noise fixture (A-06),
# the pinned production corpus/model, and the pinned native (llama.cpp) stack.
# Plus the durable representation of gates that cannot run in CI at all (device
# interop, accessibility, battery/thermal, signing) in
# docs/production/RELEASE_GATES_STATUS.json, validated by repository-verification.
#
# Stage 4A split the former combined `android-release-artifact` job into two:
#
#   * android-archive-only-release is REPO-OWNED and goes GREEN. The LIGHT
#     release links only :core (Archive repository + crypto); :llm is
#     testImplementation-only and :mesh is not a dependency, so the scoped
#     :app:assembleLightRelease / :app:bundleLightRelease tasks (and the
#     lintVitalLightRelease that assemble pulls in) configure ONLY :app + :core
#     and do NOT configure :llm's CMake add_subdirectory(third_party/llama.cpp).
#     An Archive-only LIGHT binary does NOT need llama.cpp, model weights, or
#     Oracle. This is a shipping-artifact gate, not an external-content gate.
#
#     One AGP subtlety the gate handles: the FULL :app:lintLightRelease (unlike
#     lintVitalLightRelease) analyzes the unit-test component, whose
#     testImplementation(project(":llm")) resolves :llm:release and builds the
#     :llm AAR -> :llm:configureCMakeRelWithDebInfo[arm64-v8a] -> fails on the
#     absent native stack. That is a lint-analysis scope pulling the NON-SHIPPING
#     test-only :llm module -- NOT a shipping-artifact dependency (the scoped
#     assemble+bundle build itself succeeds without llama.cpp, per A2's resolved
#     lightRelease classpath containing no :llm edge). :app's lint is therefore
#     configured with ignoreTestSources=true (see app/build.gradle.kts) so the
#     full release lint skips the test component and keeps strict lint
#     (abortOnError + warningsAsErrors) on the SHIPPING sources only.
#   * llm-native-stack stays RED until the approved pinned llama.cpp native
#     stack is restored. It deliberately exercises :llm and must NOT block the
#     Archive-only binary above.
#
# The remaining external jobs (noise-conformance, production-corpus,
# llm-native-stack) are EXPECTED TO BE RED until their external inputs are
# pinned and reviewed. A red external release-gates job is the truthful state,
# not a failure to fix. Triggers include remediation/** so the fail-closed state
# is visible on the branch rather than silently skipped.
on:
  push:
    branches:
      - main
      - 'remediation/**'
      # Evaluate immutable-candidate commits before main convergence.
      - 'board1/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All actions pinned to immutable 40-char SHAs.
#   actions/checkout            @11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python        @a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/setup-java          @c5195efecf7bdfc987ee8bae7a71cb8b11521c00
#   gradle/actions/setup-gradle @0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
#   actions/upload-artifact     @ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:

  noise-conformance:
    name: A-06 independent Noise conformance (fail-closed until pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      - run: pip install -r content/requirements.txt
      # Build the archive so Invariant C (C3 probe suite) has dist/archive_medium.db
      # to run against. WITHOUT this, --scope all dies on Invariant C ("missing
      # dist/archive_medium.db") BEFORE reaching Invariant D, which makes the job
      # red for a SPURIOUS reason and masks the truthful fail-closed signal
      # (Invariant D: no approved EXTERNAL Noise fixture). --no-embed keeps this
      # repo-owned (no model fetch); the embedded corpus is the separate
      # production-corpus gate below.
      - name: build archive for the gate (no embeddings -- repo-owned)
        run: |
          python -m content.ingest.build_archive \
            --tier MEDIUM --out dist/archive_medium.db --no-embed
      - name: repository-owned parity prerequisites
        run: python ci/check_parity.py --scope repo
      - name: verify independently approved Noise input
        run: python tools/supplychain/emit_boundary.py --boundary noise_fixture --check-inputs
      - name: Noise conformance (external vector lock)
        run: python ci/check_parity.py --scope all
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-noise-conformance
          path: provenance-*.json

  android-archive-only-release:
    name: Android Archive-only LIGHT release (repo-owned; green without llama.cpp/model/Oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      - name: verify committed Gradle wrapper
        working-directory: android
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradlew
          jar_sha=$(python3 -c "import hashlib;print(hashlib.sha256(open('gradle/wrapper/gradle-wrapper.jar','rb').read()).hexdigest())")
          [ "$jar_sha" = "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17" ] || { echo "::error::wrapper jar sha mismatch: $jar_sha"; exit 1; }
          grep -q distributionSha256Sum gradle/wrapper/gradle-wrapper.properties || { echo "::error::distributionSha256Sum missing"; exit 1; }
          echo "ok: committed wrapper verified"
      # A2: prove the LIGHT SHIPPING classpath is Archive-only by resolving
      # Gradle's actual lightRelease runtime + compile graphs (not just the
      # static scanner) and failing closed if they contain :llm / :mesh /
      # llama / ggml / godstone_llm. :llm is testImplementation-only, so it is
      # absent from these configs; the scoped :app tasks below therefore never
      # configure :llm's CMake build.
      - name: capture LIGHT release dependency graph (shipping classpath must exclude :llm/:mesh/llama/ggml/godstone_llm)
        working-directory: android
        run: |
          mkdir -p ../artifacts/android/deps
          ./gradlew --no-daemon :app:dependencies --configuration lightReleaseRuntimeClasspath \
            > ../artifacts/android/deps/lightReleaseRuntimeClasspath.txt
          ./gradlew --no-daemon :app:dependencies --configuration lightReleaseCompileClasspath \
            > ../artifacts/android/deps/lightReleaseCompileClasspath.txt
          # Gradle CONFIGURES every included project (settings.gradle includes
          # :llm and :mesh) even for a scoped :app:dependencies task, emitting
          # "> Configure project :llm" banners and NDK-install noise. Those are
          # configuration-time log lines, NOT dependency edges -- and crucially
          # configuring :llm only installs the NDK; it does NOT run CMake /
          # add_subdirectory(third_party/llama.cpp) (that needs :llm:assembleRelease,
          # which :app:assembleLightRelease never depends on). Strip lines
          # beginning with ">" (Gradle log banners) and blanks so the scan sees
          # only the resolved dependency tree, then fail closed on a real edge.
          if grep -hvE '^>|^$' \
              ../artifacts/android/deps/lightReleaseRuntimeClasspath.txt \
              ../artifacts/android/deps/lightReleaseCompileClasspath.txt \
            | grep -E 'project :llm|project :mesh|llama|ggml|godstone_llm'; then
            echo "::error::forbidden dependency on the LIGHT shipping classpath (see deps/*.txt)"
            exit 1
          fi
          echo "ok: LIGHT shipping classpath is Archive-only (no :llm/:mesh/llama/ggml/godstone_llm edge)"
      # A1: scoped :app tasks ONLY. A fresh GitHub checkout is already a clean
      # source tree, so there is NO root `clean test lint` here -- those root
      # tasks would configure :llm and trigger its CMake
      # add_subdirectory(third_party/llama.cpp) failure on the missing native
      # stack. assembleLightRelease + bundleLightRelease (and the
      # lintVitalLightRelease assemble pulls in) configure only :app + :core.
      # The separate :app:lintLightRelease below likewise configures only
      # :app + :core because :app's lint is configured with ignoreTestSources=true
      # (see app/build.gradle.kts) -- without it, AGP's full release lint analyzes
      # the unit-test component (testImplementation(project(":llm"))) and builds
      # :llm:release -> :llm:configureCMakeRelWithDebInfo -> fails on the absent
      # native stack.
      - name: assemble + bundle LIGHT release (Archive-only; scoped to :app)
        working-directory: android
        run: ./gradlew --no-daemon --warning-mode=all :app:assembleLightRelease :app:bundleLightRelease
      # Upload the unsigned APK/AAB immediately so the binary evidence is
      # preserved even if a later step (lint/inspect) fails.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-archive-only-unsigned
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: lint LIGHT release (Archive-only; scoped to :app)
        working-directory: android
        run: ./gradlew --no-daemon --warning-mode=all :app:lintLightRelease
      # Dump the lint text report to the log (and upload it) so the full set of
      # lint findings is diagnosable without a separate download. lintLightRelease
      # runs the full strict lint (abortOnError + warningsAsErrors) on the SHIPPING
      # sources; before the ignoreTestSources fix this step never ran (it died at
      # :llm's CMake configure), so these findings are the real full-lint signal.
      - name: dump lint text report (diagnosis)
        if: always()
        working-directory: android
        run: |
          f="app/build/intermediates/lint_intermediate_text_report/lightRelease/lintReportLightRelease/lint-results-lightRelease.txt"
          if [ -f "$f" ]; then echo "--- lint-results-lightRelease.txt ---"; cat "$f"; else echo "no lint text report at $f"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-archive-only-lint-report
          path: |
            android/app/build/reports/lint-results-lightRelease.*
            android/app/build/intermediates/lint_intermediate_text_report/**/lint-results-lightRelease.txt
          if-no-files-found: warn
      # A3: inspect the REAL APK and AAB (not just the static scanner).
      - name: inspect release artifacts (no cross-tier / model / mesh / :llm contamination)
        run: python scripts/inspect_android_artifacts.py android/app/build artifacts/android
      - name: inspect actual release ABI, page alignment, R8 and backup surface
        run: |
          set -euo pipefail
          inputs="artifacts/android/inspection/build-inputs"
          mkdir -p "$inputs"
          cp android/app/build/intermediates/merged_manifest/lightRelease/processLightReleaseMainManifest/AndroidManifest.xml \
            "$inputs/AndroidManifest.xml"
          cp android/app/build/outputs/mapping/lightRelease/mapping.txt "$inputs/mapping.txt"
          cp android/app/proguard-rules.pro "$inputs/proguard-rules.pro"
          python3 scripts/inspect_android_release.py \
            android/app/build/outputs/apk/light/release/app-light-release-unsigned.apk \
            --aab android/app/build/outputs/bundle/lightRelease/app-light-release.aab \
            --merged-manifest "$inputs/AndroidManifest.xml" \
            --mapping "$inputs/mapping.txt" --rules "$inputs/proguard-rules.pro" \
            --dependencies artifacts/android/deps/lightReleaseRuntimeClasspath.txt \
            --out artifacts/android/release-report.json
      # T52: the step above is EXCLUSION evidence only -- it would pass an app that
      # contains no usable archive at all. The guarded step below is the PRESENCE
      # form: when (and only when) the production content gates have staged real
      # approved bytes, it requireth exactly those bytes -- singular, byte-true,
      # integrity-checked, counts sworn, FTS-answering, engine-resolved -- in every
      # artifact, and prohibiteth fixtures packaged as production. While
      # A06/APPROVED_CONTENT stand OPEN nothing is staged: the step recordeth
      # dormancy and exiteth 0, never a false closure.
      - name: prove the approved Archive bytes inside the release artifacts (guarded presence form)
        run: |
          approved="artifacts/approved/archive_light.db"
          manifest="artifacts/approved/APPROVED_ASSETS.json"
          if [ ! -f "$approved" ] || [ ! -f "$manifest" ]; then
            echo "no approved Archive staged (external content gates stand OPEN); exclusion-only evidence recorded above"
            exit 0
          fi
          python scripts/inspect_android_artifacts.py android/app/build artifacts/android-presence \
            --expected-archive "$approved" --approved-manifest "$manifest" --release-candidate
          mkdir -p artifacts/android/presence
          cp artifacts/android-presence/artifact-inventory.json \
             artifacts/android-presence/approved-archive-presence.json \
             artifacts/android/presence/
      - name: record artifact namelists and checksums
        run: |
          set -e
          mkdir -p artifacts/android/inspection
          for a in $(find android/app/build -name '*.apk' -o -name '*.aab' | sort); do
            base=$(basename "$a")
            unzip -l "$a" > "artifacts/android/inspection/${base}.namelist.txt"
            sha256sum "$a" | tee "artifacts/android/inspection/${base}.sha256.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-archive-only-inspection
          path: artifacts/android
          if-no-files-found: error
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-android-archive-only
          path: provenance-*.json

  llm-native-stack:
    name: LLM native stack (:llm release; fail-closed until pinned llama.cpp restored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      # A4: the separate native-stack gate. This deliberately exercises :llm,
      # whose CMake add_subdirectory(third_party/llama.cpp) fails until the
      # approved pinned llama.cpp native stack is restored. It may stay RED.
      # It MUST NOT block the Archive-only LIGHT binary above, which links only
      # :core and never configures :llm. (No root clean/test/lint -- those would
      # be configuration-scope, not the native build under test here.)
      - name: compile repository-owned LLM Kotlin
        working-directory: android
        run: ./gradlew --no-daemon --warning-mode=all :llm:compileReleaseKotlin
      - name: verify approved native stack input
        run: python tools/supplychain/emit_boundary.py --boundary native_models --check-inputs
      - name: assemble :llm release (requires restored pinned llama.cpp native stack)
        working-directory: android
        run: ./gradlew --no-daemon --warning-mode=all :llm:assembleRelease
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-llm-native-stack
          path: provenance-*.json

  production-corpus:
    name: production corpus + embedded archive (fail-closed until model pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      - run: pip install -r content/requirements.txt
      - name: verify independently approved model weights
        run: python tools/supplychain/emit_boundary.py --boundary model_weights --check-inputs
      - name: verify independently approved content inputs
        env:
          GODSTONE_APPROVALS_DIR: ${{ vars.GODSTONE_APPROVALS_DIR }}
          GODSTONE_REVIEWER_KEYSET: ${{ secrets.GODSTONE_REVIEWER_KEYSET }}
        run: python tools/supplychain/emit_boundary.py --boundary approved_content --check-inputs
      - name: restore pinned model
        run: scripts/fetch_models.sh
      - name: build MEDIUM archive with embeddings
        env:
          GODSTONE_APPROVALS_DIR: ${{ vars.GODSTONE_APPROVALS_DIR }}
          GODSTONE_REVIEWER_KEYSET: ${{ secrets.GODSTONE_REVIEWER_KEYSET }}
        run: |
          # A release requires independent approvals, provenance and pinned weights.
          python -m content.ingest.build_archive \
            --tier MEDIUM --out dist/archive_medium.db --release \
            --approvals-dir "$GODSTONE_APPROVALS_DIR" --reviewer-keyset "$GODSTONE_REVIEWER_KEYSET"
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-production-corpus
          path: provenance-*.json

  ios-archive-only-release:
    name: iOS Archive-only LIGHT unsigned artifact (internal; production content and signing external)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: install declared inspection and project-generation tools
        run: |
          set -euo pipefail
          pip install -r content/requirements-dev.txt
          brew install xcodegen
      - name: verify Archive-only shipping isolation and supply chain
        run: |
          set -euo pipefail
          python3 ci/check_lab_isolation.py --explain
          python3 ci/check_lab_isolation.py --selftest
          python3 tools/supplychain/supply_chain.py verify --all
          python3 scripts/inspect_ios_artifacts.py --selftest
      - name: build unsigned Archive-only LIGHT product
        run: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml
          xcodebuild -project ios/Godstone.xcodeproj -scheme Godstone-Light \
            -configuration LightRelease -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/board1-light-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: inspect the actual unsigned iOS artifact
        run: |
          python3 scripts/inspect_ios_artifacts.py \
            "$RUNNER_TEMP/board1-light-derived/Build/Products/LightRelease-iphoneos/Godstone.app" \
            --out "$RUNNER_TEMP/ios-artifact-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-archive-only-unsigned
          path: |
            ${{ runner.temp }}/ios-artifact-report.json
            ${{ runner.temp }}/board1-light-derived/Build/Products/LightRelease-iphoneos/Godstone.app/**
          if-no-files-found: error