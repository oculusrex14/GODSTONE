name: repository-verification

# The canonical, green-capable, repository-owned verification workflow. It must
# be able to go GREEN with NO production corpus, model, native stack or signing
# asset -- everything it needs is in the repo. External/fail-closed gates
# (independent Noise vectors / A-06, production corpus, model/native stack,
# device interop, accessibility, battery/thermal, signing) live in
# release-gates.yml and docs/production/RELEASE_GATES_STATUS.json.
on:
  push:
    branches:
      - main
      - 'remediation/**'
      - 'codex/**'
      # BOARD 1's closure branch. The canonical workflow triggers on `main`, `remediation/**` and
      # `codex/**`, so the Board 1 branch was pushed and ran NOTHING -- its first push produced no run at
      # all. A green candidate cannot be evidenced by a workflow that never woke up for it.
      - 'board1/**'
      - 'board2/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All actions pinned to immutable 40-char SHAs (ci/no_release_bypasses.py
# rejects mutable @vN / @main / @master refs).
#   actions/checkout            @11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python        @a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/setup-java          @c5195efecf7bdfc987ee8bae7a71cb8b11521c00
#   gradle/actions/setup-gradle @0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
#   actions/upload-artifact     @ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:

  constraints:
    name: constraint audit (C1/C2 + tiers + release-gate status)
    runs-on: ubuntu-latest
    steps:
      # *** fetch-depth: 0 IS REQUIRED, NOT AN OPTIMISATION. *** *`ci/check_release_gates_status.py` refuseth
      # evidence whose `evidence_commit` doth not resolve in the repository history, and the default checkout
      # depth is 1 -- so on the runner EVERY recorded evidence pointer resolveth to "not a commit in the
      # repository history" and the job faileth, green locally only because a full clone happeneth to carry it.
      # MEASURED: "android-archive-only-release: stale evidence -- the evidence_commit 3ddb6f68368a3877afacc189d348b0dde8a9941e
      # doth not resolve", while that very commit IS an ancestor of HEAD. THE DEFECT WAS IN THE CHECKOUT, NOT THE EVIDENCE:
      # the honest repair is to give the checker the history it audits, NEVER to relax the staleness refusal.*
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      - name: no network permission on Android
        run: |
          if grep -rn 'uses-permission' android/ --include='*.xml' \
               | grep 'android.permission.INTERNET' \
               | grep -v 'tools:node="remove"' ; then
            echo '::error::android.permission.INTERNET is granted - violates C1'
            exit 1
          fi
          echo 'ok: no INTERNET permission granted'
      - name: no networking APIs on iOS
        run: |
          if grep -rnE 'URLSession|NSURLConnection|CFStream|Network\.framework' \
               ios/ --include='*.swift' --include='*.m' --include='*.mm' ; then
            echo '::error::iOS networking API referenced - violates C1'
            exit 1
          fi
          echo 'ok: no networking APIs'
      - name: no analytics or crash reporting
        run: |
          if grep -rniE 'firebase|crashlytics|sentry|amplitude|mixpanel|appcenter' \
               android/ ios/ --include='*.kts' --include='*.gradle' \
               --include='*.plist' --include='*.yml' --include='*.resolved' ; then
            echo '::error::telemetry dependency found - violates C2'
            exit 1
          fi
          echo 'ok: no telemetry'
      - name: tier tables agree across platforms
        run: python scripts/check_tiers.py
      - name: release-gate status represented (no skipped external gates)
        run: python ci/check_release_gates_status.py
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-constraints
          path: provenance-*.json

  invariants:
    name: repo-owned parity + safety invariants (A,B,C,E,F,G,H)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # *** fetch-depth: 0 IS REQUIRED BY THE BOARD 1 READINESS SUITE. *** The T01
          # preservation court asserts ANCESTRY facts (`git merge-base --is-ancestor`)
          # and the evidence digests resolve commits, and actions/checkout defaults to
          # fetch-depth: 1 -- a shallow clone resolves every historical SHA to "not a
          # commit". This is the same defect that once made check_release_gates_status.py
          # resolve every evidence pointer to a non-commit; the remedy is the checkout,
          # never a relaxed assertion.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      - run: pip install -r content/requirements-dev.txt
      - name: Board 1 readiness courts (the whole internally executable population)
        run: |
          # ONE CANONICAL HOSTED WITNESS for the Board 1 readiness suite. Before this
          # step the eight rc3 courts ran only locally, so the closure's green rested on
          # a developer's machine rather than on the runner -- and the mission requires
          # the canonical workflow to execute them.
          #
          # NO EXTERNAL ARTEFACT IS NEEDED and none is fetched: the suite runs with no
          # model, no device and no approval, which is precisely why these courts are
          # Board 1 work rather than external gates.
          #
          # THE COUNT IS ENFORCED, because this repository has repeatedly met tests that
          # existed but executed ZERO cases. A population that runs nothing is not a pass.
          # *** `pipefail` IS LOAD-BEARING, NOT DECORATION. ***
          #
          # THIS WAS `python -m unittest ... | tee readiness.log` UNDER THE DEFAULT
          # `bash -e`, WHICH HAS **NO `pipefail`**: a pipeline's status is its LAST
          # element, so the step's exit code was `tee`'s zero no matter what the
          # suite reported, and errexit does not fire for a non-final element.
          #
          # MEASURED, NOT REASONED: a test was planted to fail, the step was run in
          # this exact pipeline form, and it reported **exit=0** while the log
          # carried a `FAILED` line and `Ran 760 tests` -- which also satisfied the
          # floor below, because a failing run still prints its count. The step
          # whose ONLY purpose is the hosted witness for these courts could not
          # fail. That is the exact defect class this mission exists to remove.
          # *** THE LOG LIVES OUTSIDE THE TREE. ***
          #
          # THIS WROTE `readiness.log` INTO THE REPOSITORY, AND THE PROVENANCE STEP
          # BELOW -- correctly -- REFUSED: "working tree is dirty (git status
          # --porcelain non-empty) -- evidence from a dirty tree is diagnostic only".
          # *A stray log is residue, and the remedy is never to teach the provenance
          # check to ignore it.* The T77 rehearsal step in this same workflow already
          # writes its report to `RUNNER_TEMP` for exactly this reason, and the
          # convention is followed rather than re-argued.
          set -euo pipefail
          READINESS_LOG="${RUNNER_TEMP:-/tmp}/readiness.log"
          python -m unittest discover -s tools/readiness/tests -v 2>&1 | tee "$READINESS_LOG"
          # the verdict is read from the log EXPLICITLY: the floor and the presence
          # checks below both pass on a FAILED run, so this is the guard that matters.
          if grep -qE '^(FAILED|ERROR)' "$READINESS_LOG"; then
            echo "::error::the readiness suite reported failures"
            tail -40 "$READINESS_LOG"
            exit 1
          fi
          grep -qE '^OK' "$READINESS_LOG" || {
            echo "::error::the readiness suite printed no OK verdict"
            tail -20 "$READINESS_LOG"
            exit 1
          }
          executed=$(grep -oE "^Ran [0-9]+ tests" "$READINESS_LOG" | grep -oE "[0-9]+" | head -1)
          echo "readiness suite executed ${executed:-0} tests"
          if [ -z "$executed" ] || [ "$executed" -lt 700 ]; then
            echo "::error::the readiness suite executed ${executed:-0} tests; the floor is 700"
            exit 1
          fi
          # *** THE DEFERRALS ARE COUNTED, NOT IGNORED. ***
          #
          # The T01 HISTORICAL arms need a preservation capture that lives OUTSIDE
          # this repository and is absent on a runner, so they raise SkipTest and the
          # runner prints `OK (skipped=N)`. A skip is now DISTINGUISHABLE from a pass
          # -- which is the whole point -- but a step that silently accepted N skips
          # would still be claiming a witness it did not have. The count is therefore
          # REPORTED and bounded: the reusable arms must all have run.
          skipped=$(grep -oE "skipped=[0-9]+" "$READINESS_LOG" | grep -oE "[0-9]+" | head -1)
          echo "readiness suite skipped ${skipped:-0} historical arm(s)"
          if [ -z "$skipped" ]; then
            echo "::error::the readiness suite reported no skip count at all; the T01 "
            echo "::error::historical arms cannot be accounted for"
            exit 1
          fi
          # *** THE BOUND IS THE POPULATION MEASURED ON THIS RUNNER, NOT A LOCAL ESTIMATE. ***
          #
          # IT WAS 40, DESCRIBED AS "(T01 historical 20, evidence digests 8, remediation 6)" --
          # WHICH IS 34, so a SIX-ARM REGRESSION could have slipped through unnoticed.
          #
          # *** AND I FIRST "MEASURED" IT AS 16 IN A LOCAL CLONE, WHICH WAS WRONG. *** *A
          # clone under-reports: the local working tree carries the out-of-repo evidence root as
          # a sibling directory, so the evidence-digest and remediation arms EXECUTE here and
          # DEFER on a runner where that root is absent. The hosted step then FAILED against my
          # 16. THE ONLY VALID MEASUREMENT OF A RUNNER-SIDE POPULATION IS THE RUNNER'S OWN
          # OUTPUT -- 30, composed of 16 T01 historical (each naming "no preservation capture
          # beside this checkout") plus 14 evidence-digest/remediation (each naming "the
          # out-of-repository evidence root is absent"). Both shares are printed by the arms
          # themselves, so the composition is auditable rather than inferred.*
          #
          # The four TAMPER CONTROLS that needed only self-consistency were moved off
          # `@historical_arm` in this round and now EXECUTE here, which is why the T01 share is
          # 16 rather than 20.
          #
          # A skip count ABOVE this means a control that should execute did not -- the failure
          # this step exists to refuse -- and the number is not a budget to make room for.
          if [ "$skipped" -gt 30 ]; then
            echo "::error::${skipped} arms were skipped; the capture-dependent population is"
            echo "::error::MEASURED at 30 on a runner (16 T01 historical + 14 evidence/remediation)."
            echo "::error::A larger number means a control that should execute did not."
            exit 1
          fi
          if [ "$skipped" -gt 0 ]; then
            echo "::notice::${skipped} capture-dependent arm(s) deferred: they assert the"
            echo "::notice::REAL preservation capture and the REAL registered evidence, and"
            echo "::notice::that root lives outside the repository (untracked, by design)."
            echo "::notice::Their questions are NOT answered here, and this step does not"
            echo "::notice::claim they were."
          fi
          # the courts this mission authored must be PRESENT, not merely counted: a
          # suite that dropped one would still clear a total-count floor.
          for court in test_t62 test_t64 test_t65 test_t73 test_t74 test_t75 test_t76 test_t78 test_t79 test_t80 test_t81; do
            case "$court" in
              test_t62|test_t64|test_t65) continue ;;   # native courts: Kotlin/Swift lanes
            esac
            grep -q "$court" "$READINESS_LOG" || { echo "::error::$court did NOT run"; exit 1; }
          done
      - name: Board 1 blocker frontier (the classification court)
        run: |
          python tools/readiness/blockers.py --check
          python -m unittest discover -s tools/readiness/tests -p test_blocked_external.py -v
      - name: build archive for the gate (no embeddings -- repo-owned)
        run: |
          python -m content.ingest.build_archive \
            --tier MEDIUM --out dist/archive_medium.db --no-embed
      - name: regenerate wire codecs and crypto vectors
        run: |
          python -m wire.codegen
          python -m crypto.port_vectors
          python -m crypto.gen_vectors
          python -m crypto.gen_gmp21_vectors
          python -m crypto.gen_identity_binding_vectors
          python wire/ble_record_reference.py --generate
          python wire/ble_link_info_reference.py --generate
      - name: identity binding python conformance (ADR-003, C8.1A)
        run: python -m crypto.test_identity_binding
      - name: ble record python conformance (ADR-002, C8.4C)
        run: |
          python wire/ble_record_reference.py --check
          python wire/ble_record_reference.py
      - name: ble link info python conformance (ADR-002, C8.4D1)
        run: |
          python wire/ble_link_info_reference.py --check
          python wire/ble_link_info_reference.py
      # F and G selftests FIRST: a control that has never fired is not a control.
      - name: symbol resolver negative control
        run: python ci/symbols.py --selftest
      - name: integration reachability negative control
        run: python ci/integration.py --selftest
      # --scope repo runs A,B,C,E,F,G,H and reports D (external Noise / A-06)
      # as OPEN. D is exercised fail-closed under --scope all in release-gates.
      - name: invariants A,B,C,E,F,G,H (repo scope; D is an external gate)
        run: python ci/check_parity.py --scope repo
      - name: no release bypasses / oracle private draft / shipping path
        run: python ci/check_repository.py
      - name: no production CAS guard-bypass (C6.4.1-A)
        run: |
          python ci/no_delivery_guard_bypass.py --selftest
          python ci/no_delivery_guard_bypass.py
      - name: store schema/persist negative controls present (C6.4.1-BCDEFGH)
        run: |
          python ci/check_store_schema_controls.py --selftest
          python ci/check_store_schema_controls.py
      - name: identity binding regression controls present (ADR-003, C8.1A)
        run: |
          python ci/check_identity_binding_controls.py --selftest
          python ci/check_identity_binding_controls.py
      - name: local identity state regression controls present (ADR-003, C8.1B)
        run: |
          python ci/check_local_identity_controls.py --selftest
          python ci/check_local_identity_controls.py
      - name: peer trust regression controls present (ADR-003, C8.2A)
        run: |
          python ci/check_peer_trust_controls.py --selftest
          python ci/check_peer_trust_controls.py
      - name: peer identity store regression controls present (ADR-003, C8.2B)
        run: |
          python ci/check_peer_identity_store_controls.py --selftest
          python ci/check_peer_identity_store_controls.py
      - name: bound recipient key resolver regression controls (ADR-003, C8.3)
        run: |
          python ci/check_bound_recipient_key_resolver_controls.py --selftest
          python ci/check_bound_recipient_key_resolver_controls.py
      - name: trusted handshake regression controls (ADR-003, C8.4A)
        run: |
          python ci/check_trusted_handshake_controls.py --selftest
          python ci/check_trusted_handshake_controls.py
      - name: trusted runtime composition regression controls (ADR-003, C8.4B)
        run: |
          python ci/check_trusted_runtime_composition_controls.py --selftest
          python ci/check_trusted_runtime_composition_controls.py
      - name: canonical BLE record layer regression controls (ADR-002, C8.4C)
        run: |
          python ci/check_ble_record_controls.py --selftest
          python ci/check_ble_record_controls.py
      - name: persistent duplex BLE link substrate regression controls (ADR-002, C8.4D1)
        run: |
          python ci/check_ble_link_substrate_controls.py --selftest
          python ci/check_ble_link_substrate_controls.py
      - name: evidence digests, required runs, current assessment, commit provenance
        run: |
          # THESE FOUR WERE CALLED "GREEN" BY THE CLOSURE WHILE HAVING **NO CI
          # INVOCATION AT ALL** -- they passed only on the builder's machine, where
          # the out-of-repository evidence root existeth. A control that never runs
          # in the canonical workflow is not a control the candidate can cite.
          #
          # Each handles an absent evidence root as a VALUE rather than a crash, so
          # they are safe on a runner; where a root is genuinely required and absent,
          # the control NAMES it instead of passing.
          # *** `check_evidence_digests` IS DELIBERATELY NOT HERE, AND THE REASON IS
          # ITS OWN LAW: "UNEXAMINED EVIDENCE IS NOT VERIFIED EVIDENCE". It asserts
          # the REAL registered evidence verifies, which needs the out-of-repository
          # evidence root -- absent on a runner, where it correctly returneth rc 1.
          # Wiring it in would redden every runner for a reason that says nothing
          # about the candidate, and suppressing it would be the false all-clear. So
          # its POPULATION is covered here by the evidence-digest COURT, which
          # defers visibly (skip) where the root is absent, and the CONTROL runs
          # wherever the root existeth.
          python ci/check_required_runs.py
          python ci/check_current_assessment.py
          python ci/check_commit_provenance.py
      - name: closed-loop control plane (AUDIT-B1-CTRL-001)
        run: |
          # *** THE INDEPENDENT AUDIT'S CONTROL-PLANE FINDING, MADE UNREPEATABLE. ***
          #
          # MEASURED BY THE AUDIT: this repository permitted
          # `BOARD1_CLOSURE.status = COMPLETE` while the remediation register carried
          # `independent_status = NO_GO` and live PARTIAL findings. *A control plane that can report
          # closure over a NO_GO register is worse than having no closure record, because it is
          # believed.*
          #
          # THE AUTHORITY IS NOW STRUCTURED, NOT PROSE. `internal_remaining` was derived by
          # substring-matching narrative and produced 27, 21, 5 and 4 across four marker lists --
          # a number that moves with the vocabulary of its own input measures the classifier, not
          # the repository. `finding_closure` carries an EXPLICIT status per obligation, and the
          # counts are taken from those statuses.
          #
          # THE GATE REFUSES a COMPLETE / READY_FOR_EXTERNAL_REAUDIT builder status while any
          # structured internal obligation is OPEN, and refuses any non-zero `verified_fixed`
          # because only an INDEPENDENT audit may write that value.
          python scripts/build_structured_closure.py
          python scripts/build_structured_closure.py --check
      - name: production-readiness status consistency (Stage 4E0)
        run: |
          python ci/check_status_consistency.py --selftest
          python ci/check_status_consistency.py
      - name: no legacy GMP/1 wire symbol
        run: python ci/no_legacy_wire.py --selftest
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-invariants
          path: provenance-*.json

  content:
    name: content pipeline (LIGHT archive, no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      - name: install
        run: pip install -r content/requirements-dev.txt
      - name: build a LIGHT archive without embeddings
        run: |
          python -m content.ingest.build_archive \
            --tier LIGHT --out /tmp/archive_light.db --no-embed
      - name: archive is queryable and correctly indexed
        run: |
          python - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect('/tmp/archive_light.db')
          meta = dict(db.execute('SELECT key, value FROM archive_meta'))
          print('corpus_sha256', meta['corpus_sha256'])
          assert meta['tier'] == 'LIGHT'
          docs = db.execute('SELECT COUNT(*) FROM documents').fetchone()[0]
          chunks = db.execute('SELECT COUNT(*) FROM chunks').fetchone()[0]
          assert docs > 0 and chunks > 0, 'empty archive'
          rows = db.execute('''
              SELECT c.chunk_id, d.title, c.section
              FROM chunks_fts
              JOIN chunks c ON c.chunk_id = chunks_fts.rowid
              JOIN documents d ON d.document_id = c.document_id
              WHERE chunks_fts MATCH 'tourniquet'
              ORDER BY bm25(chunks_fts) LIMIT 5
          ''').fetchall()
          assert rows, 'FTS join returned nothing'
          print('fts ok:', rows[0])
          leaked = db.execute(
              "SELECT COUNT(*) FROM documents WHERE tier_min != 'LIGHT'"
          ).fetchone()[0]
          assert leaked == 0, f'{leaked} non-LIGHT documents in a LIGHT build'
          print('tier filtering ok')
          PY
      - name: build is deterministic
        run: |
          python -m content.ingest.build_archive \
            --tier LIGHT --out /tmp/archive_two.db --no-embed
          a=$(sqlite3 /tmp/archive_light.db \
                "SELECT value FROM archive_meta WHERE key='corpus_sha256'")
          b=$(sqlite3 /tmp/archive_two.db \
                "SELECT value FROM archive_meta WHERE key='corpus_sha256'")
          if [ "$a" != "$b" ]; then
            echo "::error::corpus_sha256 not reproducible: $a vs $b"
            exit 1
          fi
          echo "ok: reproducible ($a)"
      - run: python -m unittest discover -s content/tests -v
      # T77: the UPDATE is a transaction, and this lane proveth it. The
      # recovery authority's selftest fireth first -- a control that never
      # fired is not a control -- then the declared rehearsal ladder runneth
      # every required case (content replacement, a declared schema migration
      # and an undeclared one refused, an unsupported downgrade refused, an
      # unknown future schema refused and never recreated empty, interrupted
      # update, interrupted staging, disk full, rollback, wipe in progress and
      # the offline refusal), then the court itself sits. Everything here is
      # repo-owned and built from harmless, visibly labelled development
      # fixtures signed with a TEST-ONLY key; the report sayeth so, closes no
      # external gate and claims nothing about any device.
      # GS-CTRL-002: the rehearsal's WORK AREA and REPORT are written OUTSIDE the source
      # tree, under a run-specific directory in RUNNER_TEMP. The audited form wrote the
      # report as a RELATIVE path (`--report recovery-rehearsal.json`), which left
      # UNTRACKED residue in a clean checkout and made the provenance check below fail --
      # and a red provenance check may not be repaired by ignoring the file, cleaning the
      # tree or deleting the evidence. The provenance manifest itself stayeth under its
      # REVIEWED ignore policy (.gitignore: it is a workflow artifact, never committed);
      # only the untracked artifact moved. The CLI now REFUSETH an in-tree report path
      # outright, so the contract is ENFORCED and not merely conventional.
      - name: archive update recovery (upgrade, rollback, interruption, wipe)
        env:
          T77_RUN_DIR: ${{ runner.temp }}/t77-recovery
        run: |
          mkdir -p "$T77_RUN_DIR"
          python3 scripts/upgrade_recovery.py --selftest
          python3 scripts/upgrade_recovery.py rehearse \
            --work "$T77_RUN_DIR/work" --report "$T77_RUN_DIR/recovery-rehearsal.json"
          python3 -m unittest discover -s tools/readiness/tests -p test_t77.py
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      # GS-CTRL-002 (AUDIT-004 step 1): the rehearsal's report liveth OUTSIDE the source tree
      # by law, so the workflow must UPLOAD it -- a report left on the runner is not evidence.
      # The audited revision declared the external path and never uploaded it, so the whole
      # rehearsal left no retrievable artifact. `if: always()` is REQUIRED: without it a red
      # stage BELOW would destroy the evidence of the stage that produced the report.
      # The path is not spelled twice by hand -- it is the same `$T77_RUN_DIR` expression the
      # rehearsal step useth, and the canonical court (test_t77.py W-R6) DERIVES it from that
      # env and the step's own `--report` argument, so moving the rehearsal moveth the upload.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t77-recovery-rehearsal
          path: ${{ runner.temp }}/t77-recovery/recovery-rehearsal.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-content
          path: provenance-*.json

  meshsim:
    name: mesh simulation (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      - name: city blackout, 200 nodes
        run: |
          python -m meshsim.run --nodes 200 --scenario city_blackout \
            --ticks 600 --assert-regression
      - name: other scenarios
        run: |
          for s in rural_sparse crowd_surge partition_heal flat_batteries; do
            echo "--- $s"
            python -m meshsim.run --nodes 120 --scenario "$s" --ticks 400
          done
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-meshsim
          path: provenance-*.json

  android:
    name: android source compile + unit tests (committed wrapper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      # A2: CI must use the COMMITTED wrapper. Never `gradle wrapper` to
      # regenerate it -- that contradicts the pinned-wrapper policy. Verify the
      # wrapper jar + properties + gradlew are present and the jar matches its
      # pinned SHA-256, and that distributionSha256Sum is present so the
      # wrapper itself verifies the downloaded Gradle distribution.
      - name: verify committed Gradle wrapper (no dynamic generation)
        working-directory: android
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          jar_sha=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open('gradle/wrapper/gradle-wrapper.jar','rb').read()).hexdigest())")
          want="498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17"
          [ "$jar_sha" = "$want" ] || { echo "::error::gradle-wrapper.jar sha256 mismatch: got $jar_sha want $want"; exit 1; }
          grep -q distributionSha256Sum gradle/wrapper/gradle-wrapper.properties \
            || { echo "::error::distributionSha256Sum missing from gradle-wrapper.properties"; exit 1; }
          echo "ok: committed wrapper verified (jar+properties+gradlew, distributionSha256Sum pinned)"
      # T68: the reviewed supply-chain documents are themselves checked into this
      # repository, so this audit is host-independent: it verifies the toolchain
      # lock against the current digests of the input files it names (a changed
      # NDK/CMake/JDK pin without a re-capture is a failure), the hash-locked
      # dependency manifest against the requirement sources, the Gradle
      # verification metadata (every component must carry a SHA-256), the SBOM
      # against every component those locks name, and the recorded determinism
      # comparison. It needs no network and no wheelhouse.
      - name: verify the pinned build supply chain
        run: python3 tools/supplychain/supply_chain.py verify --all
      - name: compile Kotlin surfaces and run host unit tests
        working-directory: android
        run: |
          ./gradlew \
            :core:assembleDebug :core:testDebugUnitTest \
            :mesh:testDebugUnitTest \
            :llm:testDebugUnitTest \
            :app:compileLightDebugKotlin \
            :app:testLightDebugUnitTest \
            :labmesh:testDebugUnitTest \
            --no-daemon
      # *** THE ANDROID LANES ARE JUDGED BY THE SAME COMMITTED CONTROL, SCOPED TO THIS JOB. ***
      #
      # *THE GAP: the android job ran gradle DIRECTLY and never invoked `check_lane_results.py`, so its lane
      # artifacts were produced and never judged -- **the same "machinery exists but is not the canonical gate"
      # shape the UI lane had.** The digests are written here by the same tool the committed runner uses, so the
      # control can bind each result to the source bytes it tested.
      - name: android lane control (scoped to this job's lanes)
        run: |
          set -euo pipefail
          python3 tools/readiness/android_source_digest.py >android-app.sources.sha256
          python3 tools/readiness/android_source_digest.py --lane android:core >android-core.sources.sha256
          python3 tools/readiness/android_source_digest.py --lane android:mesh >android-mesh.sources.sha256
          python3 ci/check_lane_results.py --scope android

      - name: lab-isolation gate (T54) -- prove the nonshipping LabMesh targets
          # The lab is a SEPARATE application identity (io.godstone.labmesh) that
          # reaches the canonical runtime components; the LIGHT Archive-only
          # profile must carry no lab source set, no :mesh edge and no readiness
          # override. The gate resolves both profiles from build-config evidence
          # and refuses each violation by name; --selftest exercises its controls.
        run: |
          python3 ci/check_lab_isolation.py --explain
          python3 ci/check_lab_isolation.py --selftest
      - name: build a usable debug Archive with a harmless development fixture
        run: |
          python ci/archive_fixture.py --out android/app/src/lightDebug/assets/archive_light.db
          cd android
          ./gradlew :app:assembleLightDebug --no-daemon
      - name: prove the selected Archive bytes reached the APK
        run: |
          python scripts/inspect_android_artifacts.py --selftest
          python scripts/inspect_android_artifacts.py android/app/build/outputs/apk artifacts/android-debug \
            --expected-archive android/app/src/lightDebug/assets/archive_light.db
      - name: verify merged manifest has no INTERNET permission
        run: |
          manifest=$(find android -name AndroidManifest.xml -path '*merged*' | head -1)
          if [ -n "$manifest" ] && grep -q 'android.permission.INTERNET' "$manifest"; then
            echo '::error::INTERNET permission appeared via a library merge'
            exit 1
          fi
          echo 'ok: merged manifest clean'
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-test-results
          path: |
            **/build/reports/tests/**
            provenance-*.json

  ios:
    name: ios core + mesh tests + Archive-only xcodebuild
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: provenance (start -- clean checkout)
        run: python ci/provenance.py --out provenance-start.json
      # Drift gate: the committed ios/Packages/GodstoneFoundation tree must be
      # byte-identical to what sync_ios_foundation_package.py would regenerate.
      - run: python scripts/sync_ios_foundation_package.py --check
      # *** XCODEGEN IS INSTALLED *BEFORE* THE STEP THAT USES IT. ***
      #
      # *MEASURED FAILURE: the hosted run `35538113990` failed `ios` with `xcodegen: command not found`, because the
      # UI step invoked `xcodegen generate` while the install step sat LATER in the file. The comment inside the old
      # step claimed the ordering was fixed by regenerating locally -- **and it still ran before the install.***
      # **A STEP THAT REGENERATES THE PROJECT NEEDS THE GENERATOR TO EXIST FIRST; "self-sufficient" meant self-
      # sufficient with respect to FILE POSITION, not with respect to the TOOLCHAIN.**
      - name: install xcodegen (project regenerator)
        run: |
          brew install xcodegen
          xcodegen --version

      # *** THE iOS FOUNDATION LANE AND THE UI LANE, ONE REPOSITORY-OWNED PATH EACH. ***
      #
      # *THE DEFECT THIS CLOSES: `tools/readiness/run_ios_ui_lane.sh` was committed but invoked by NO workflow, and
      # `GodstoneArchiveUI` appeared NOWHERE in `.github/`. **THE CLAIMED REPAIR -- "committed runner + result parsing
      # + skip accounting + digest-bound log" -- EXISTED AS MACHINERY WHILE THE CANONICAL HOSTED GATE RAN AN AD-HOC
      # `LabMeshUI` xcodebuild INSTEAD, AND RAN THE ARCHIVE SCHEME NOT AT ALL.*** **So the workflow no longer keeps an
      # independent implementation of the same lane: it CALLS the committed runner, which is the only place the
      # schemes, the simulator resolution and the digest sidecar are defined.***
      # *** ONE OBVIOUS REPOSITORY-OWNED PATH PER LANE, AND ONE CONTROL AFTER BOTH. ***
      #
      # *MEASURED FAILURE, MINE, ON RUN `35902192306`: I put `check_lane_results.py` inside the FOUNDATION-LANE step,
      # where it refused thirteen things that were merely ABSENT -- **the ANDROID lanes, which a different job
      # produces, and the UI lane, which had not run yet.** The control is whole-repository by design; **asking it to
      # judge a job's worth of lanes is a category error, not a lane failure.***
      #
      # **SO IT IS SCOPED (`--scope ios`) AND IT RUNS ONCE, AFTER BOTH iOS LANES HAVE PRODUCED THEIR ARTIFACTS.** The
      # android lanes are judged by the android job's own invocation of this same committed control.
      - name: ios foundation lane (swift test)
        run: |
          set -euo pipefail
          tools/readiness/run_ios_lane.sh ios-lane.log

      - name: ios UI lane (LabMeshUI + GodstoneArchiveUI)
        run: |
          set -euo pipefail
          # *** THE RUNNER PRODUCES EVIDENCE AND EXITS 0 WHEN IT PRODUCED A LOG; THE CHECKER DECIDES THE VERDICT. ***
          # *A raw `xcodebuild` non-zero cannot distinguish the RECORDED known-red obligation from a NOVEL break, so
          # aborting on it would either suppress the obligation or force it to be hidden.*
          tools/readiness/run_ios_ui_lane.sh ios-ui-lane.log

      - name: ios lane control (scoped to this job's lanes)
        run: |
          set -euo pipefail
          # ONE invocation over both artifacts: required suites, the SOURCE-DERIVED arm roster BY NAME, zero skips,
          # the exact failed-arm set, the recorded known-red arm announced, and both digests current.
          python3 ci/check_lane_results.py --scope ios

      # xcodegen + xcodebuild Archive-only (LightRelease) is repo-owned green:
      # the app starts with a truthful local "Archive unavailable" state and
      # needs no model/native stack to build.
      - run: xcodegen generate --spec ios/project.yml
      - run: >-
          xcodebuild -project ios/Godstone.xcodeproj -scheme Godstone-Light
          -configuration LightRelease -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
      # Execute the GodstoneMeshTests (GMP/2.1 wire vectors, Blake2s port
      # vectors, router, Noise_XX handshake, GMP/2.1 msg-id/Bloom/PoW KAT parity,
      # + Phase F PanicWipe state-machine tests + Phase G durable-store tests
      # + Phase H authenticated-ACK delivery state-machine tests)
      # via xcodebuild on a simulator --
      # the real iOS test execution, not just the host swift-test mirror. The
      # scheme's test action targets GodstoneMeshTests (test-only; see
      # project.yml). Resolve the highest-numbered available iPhone simulator so
      # the step is robust across Xcode/runner-image versions. The count guard
      # below is a >=50 regression floor, not an exact pin.
      - name: xcodebuild test (GodstoneMeshTests on iOS Simulator)
        run: |
          set -e
          sim=$(xcrun simctl list devices available 2>/dev/null \
                | grep -oE 'iPhone [0-9]+( Pro Max| Pro| Plus)?' \
                | sort -u | tail -1)
          echo "Using simulator: ${sim}"
          xcodebuild -project ios/Godstone.xcodeproj -scheme Godstone-Light \
            -configuration LightDebug \
            -destination "platform=iOS Simulator,name=${sim}" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee /tmp/xcb-test.log
          # Truthful, non-brittle guard: assert the run succeeded with 0
          # failures and at least 50 executed tests (a regression below 50 --
          # e.g. a compile failure silently dropping the suite -- fails this).
          # The exact count is intentionally not pinned so adding tests (Phase F
          # added 7 -> 57; Phase G added 12 -> 69; Phase H added 12 -> 81) does not break the gate.
          grep -q "\*\* TEST SUCCEEDED \*\*" /tmp/xcb-test.log \
            || { echo "::error::xcodebuild test did not report TEST SUCCEEDED"; exit 1; }
          line=$(grep -oE "Executed [0-9]+ tests, with 0 failures" /tmp/xcb-test.log | tail -1)
          [ -n "$line" ] \
            || { echo "::error::no '0 failures' summary line found in xcodebuild output"; exit 1; }
          n=$(printf '%s' "$line" | grep -oE "[0-9]+" | head -1)
          [ "$n" -ge 50 ] \
            || { echo "::error::expected at least 50 GodstoneMeshTests with 0 failures, got $n"; exit 1; }
          echo "GodstoneMeshTests: $n executed, 0 failures (>=50 guard)"
      - name: provenance (final -- tree still clean)
        run: python ci/provenance.py --out provenance-final.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provenance-ios
          path: provenance-*.json