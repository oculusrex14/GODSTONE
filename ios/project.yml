name: Godstone
options:
  bundleIdPrefix: io.godstone
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  LightDebug: debug
  LightRelease: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

packages:
  GodstonePackages:
    path: ./Godstone

targets:
  Godstone:
    type: application
    platform: iOS
    sources:
      - path: Godstone/Sources/App/AppContainer.swift
      - path: Godstone/Sources/App/ArchiveView.swift
      - path: Godstone/Sources/App/GodstoneApp.swift
      - path: Godstone/Sources/App/GodstoneTheme.swift
      - path: Godstone/Sources/App/RootView.swift
      - path: Godstone/PrivacyInfo.xcprivacy
        buildPhase: resources
      # NOTE: The Archive (.db) and model (.gguf) assets are intentionally NOT
      # bundled as static folder resources here. They are mmap'd at runtime via
      # Bundle.main.path(forResource:) keyed off INFOPLIST_KEY_GodstoneArchiveFile
      # / GodstoneModelFile. When an approved asset is absent, the lookup returns
      # nil and the app enters a truthful unavailable/degraded state
      # (ArchiveRepository.isAvailable == false) rather than failing the build.
      # Adding a per-tier Resources/<tier> folder reference caused xcodebuild to
      # emit a CpResource for a nonexistent directory and fail; that reference is
      # removed so the app compiles with zero production content present.
      # A staging task that verifies approved assets (see content/release_gate.py)
      # is the gate before any resource phase is reintroduced.
    dependencies:
      - package: GodstonePackages
        product: GodstoneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.app
        PRODUCT_NAME: Godstone
        INFOPLIST_FILE: Godstone/Info.plist
        CODE_SIGN_ENTITLEMENTS: Godstone/Godstone.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_GodstoneTier: LIGHT
        INFOPLIST_KEY_GodstoneArchiveFile: archive_light.db
      configs:
        LightDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ARCHIVE_ONLY
        LightRelease:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
          ENABLE_TESTABILITY: NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ARCHIVE_ONLY

  # ADR-008 patch 21: the iOS cross-platform-conformance gate. A real
  # `xcodebuild test` target that EXECUTES the GMP/2.1 wire vectors, the
  # Blake2s port vectors, the router, and -- added in patch 21 -- the Noise_XX
  # handshake under the GMP2 prologue. The shipping app links only GodstoneCore
  # (LIGHT: Mesh/SOS/Bulk disabled); this test target links GodstoneMesh too so
  # the mesh codec is executed on iOS, but it is a hostless logic-test bundle
  # that never ships. It deliberately depends ONLY on GodstoneCore + GodstoneMesh
  # (never GodstoneLLM / the llama.cpp C++ bridge), so the gate runs without any
  # model binary or third-party native dependency.
  GodstoneMeshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Godstone/Tests/GodstoneMeshTests
    dependencies:
      - package: GodstonePackages
        product: GodstoneMesh
      - package: GodstonePackages
        product: GodstoneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.meshtests
        PRODUCT_NAME: GodstoneMeshTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        LightDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  Godstone-Light:
    build:
      targets:
        # Only the app target is built for build/run/archive. The
        # GodstoneMeshTests bundle is built ONLY for the test action (see
        # test.targets below), so `xcodebuild build`/`archive` do not pull in
        # the test target -- which imports GodstoneMesh, a module not in the
        # LIGHT app graph. Building it under LightRelease/generic/platform=iOS
        # fails to resolve that module; keeping it test-only makes the
        # Archive-only release build green on a clean checkout.
        Godstone: all
    run:
      config: LightDebug
    test:
      config: LightDebug
      targets:
        - GodstoneMeshTests
    analyze:
      config: LightRelease
    profile:
      config: LightRelease
    archive:
      config: LightRelease
