name: Godstone
options:
  bundleIdPrefix: io.godstone
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  LightDebug: debug
  LightRelease: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

packages:
  GodstonePackages:
    path: ./Godstone

targets:
  Godstone:
    type: application
    platform: iOS
    sources:
      - path: Godstone/Sources/App/AppContainer.swift
      - path: Godstone/Sources/App/ArchiveView.swift
      - path: Godstone/Sources/App/GodstoneApp.swift
      - path: Godstone/Sources/App/GodstoneTheme.swift
      - path: Godstone/Sources/App/RootView.swift
      - path: Godstone/PrivacyInfo.xcprivacy
        buildPhase: resources
      # NOTE: The Archive (.db) and model (.gguf) assets are intentionally NOT
      # bundled as static folder resources here. They are mmap'd at runtime via
      # Bundle.main.path(forResource:) keyed off INFOPLIST_KEY_GodstoneArchiveFile
      # / GodstoneModelFile. When an approved asset is absent, the lookup returns
      # nil and the app enters a truthful unavailable/degraded state
      # (ArchiveRepository.isAvailable == false) rather than failing the build.
      # Adding a per-tier Resources/<tier> folder reference caused xcodebuild to
      # emit a CpResource for a nonexistent directory and fail; that reference is
      # removed so the app compiles with zero production content present.
      # A staging task that verifies approved assets (see content/release_gate.py)
      # is the gate before any resource phase is reintroduced.
    dependencies:
      - package: GodstonePackages
        product: GodstoneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.app
        PRODUCT_NAME: Godstone
        INFOPLIST_FILE: Godstone/Info.plist
        CODE_SIGN_ENTITLEMENTS: Godstone/Godstone.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_GodstoneTier: LIGHT
        INFOPLIST_KEY_GodstoneArchiveFile: archive_light.db
      configs:
        LightDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ARCHIVE_ONLY
        LightRelease:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
          ENABLE_TESTABILITY: NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ARCHIVE_ONLY

  # T54: the nonshipping LabMesh application. A SEPARATE target with its OWN
  # bundle identity (io.godstone.labmesh), depending on the SAME canonical
  # runtime components the mesh tests use (GodstoneMesh + GodstoneCore) -- never
  # a lab-only twin. It is visibly experimental, it is not a store candidate, and
  # ci/check_lab_isolation.py asserteth that it and its sources can never reach
  # the LIGHT Archive-only application (whose source allowlist below is
  # unchanged).
  LabMesh:
    type: application
    platform: iOS
    sources:
      - path: Godstone/Sources/LabMesh
    dependencies:
      - package: GodstonePackages
        product: GodstoneMesh
      - package: GodstonePackages
        product: GodstoneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.labmesh
        PRODUCT_NAME: GodstoneLabMesh
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_GodstoneTier: LAB
        INFOPLIST_KEY_GodstoneProfile: LABMESH
      configs:
        LightDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG LABMESH
        LightRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: LABMESH

  # T54: the lab's own test capability -- a hostless bundle that EXECUTES the real
  # composition (adapters, durable store, trusted handshake, recipient inbox, ACK
  # road). It links only the canonical packages, never a model binary.
  LabMeshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Godstone/Tests/LabMeshTests
    dependencies:
      - package: GodstonePackages
        product: GodstoneMesh
      - package: GodstonePackages
        product: GodstoneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.labmeshtests
        PRODUCT_NAME: LabMeshTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # ADR-008 patch 21: the iOS cross-platform-conformance gate. A real
  # `xcodebuild test` target that EXECUTES the GMP/2.1 wire vectors, the
  # Blake2s port vectors, the router, and -- added in patch 21 -- the Noise_XX
  # handshake under the GMP2 prologue. The shipping app links only GodstoneCore
  # (LIGHT: Mesh/SOS/Bulk disabled); this test target links GodstoneMesh too so
  # the mesh codec is executed on iOS, but it is a hostless logic-test bundle
  # that never ships. It deliberately depends ONLY on GodstoneCore + GodstoneMesh
  # (never GodstoneLLM / the llama.cpp C++ bridge), so the gate runs without any
  # model binary or third-party native dependency.
  # *** GS-UX-001 STEP 7: A REAL UI TEST BUNDLE, SO THE CONTROLS ARE DRIVEN RATHER THAN GREPPED. ***
  #
  # THE CARD'S OWN WORDS: *"exercise the rendered controls rather than setting model state directly."*
  # **THE MEASURED GAP: `LabMeshAppTests` asserted `root.contains("sendDirect")` -- A SUBSTRING OF THE SOURCE --
  # which proveth what the code SAYETH and never what a user can DO.** A `bundle.ui-testing` target launches the
  # LabMesh APPLICATION and drives its accessibility identifiers, so a control that is not really wired fails.
  #
  # IT DEPENDS ONLY ON THE APP TARGET, no packages: a UI test drives the accessibility tree and links neither
  # GodstoneMesh nor GodstoneCore, so nothing internal crosses this seam.
  LabMeshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Godstone/Tests/LabMeshUITests
    dependencies:
      - target: LabMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.labmeshuitests
        PRODUCT_NAME: LabMeshUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LabMesh
        TARGETED_DEVICE_FAMILY: "1,2"

  GodstoneMeshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Godstone/Tests/GodstoneMeshTests
    dependencies:
      - package: GodstonePackages
        product: GodstoneMesh
      - package: GodstonePackages
        product: GodstoneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.meshtests
        PRODUCT_NAME: GodstoneMeshTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        LightDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  # *** GS-UX-001: THE LAB APP'S OWN SCHEME, DECLARED EXPLICITLY. ***
  #
  # *MEASURED: after the UI scheme was added, `xcodebuild -list` no longer showed `LabMesh` -- xcodegen's automatic
  # scheme generation covered `LabMeshTests` but NOT the app once the schemes block was edited. **A SCHEME THAT
  # DISAPPEARS IS HOW A TARGET STOPS BEING BUILT BY ANYTHING**, which is precisely the class of silent gap this
  # session keeps finding. Declared here so it cannot go missing again.*
  LabMesh:
    build:
      targets:
        LabMesh: all
    run:
      config: LightDebug

  # *** GS-UX-001 STEP 7: THE UI SCHEME, SO THE CONTROLS ARE DRIVEN IN CI. ***
  LabMeshUI:
    build:
      targets:
        LabMesh: all
    run:
      config: LightDebug
    test:
      config: LightDebug
      targets:
        - LabMeshUITests

  Godstone-Light:
    build:
      targets:
        # Only the app target is built for build/run/archive. The
        # GodstoneMeshTests bundle is built ONLY for the test action (see
        # test.targets below), so `xcodebuild build`/`archive` do not pull in
        # the test target -- which imports GodstoneMesh, a module not in the
        # LIGHT app graph. Building it under LightRelease/generic/platform=iOS
        # fails to resolve that module; keeping it test-only makes the
        # Archive-only release build green on a clean checkout.
        Godstone: all
    run:
      config: LightDebug
    test:
      config: LightDebug
      targets:
        - GodstoneMeshTests
    analyze:
      config: LightRelease
    profile:
      config: LightRelease
    archive:
      config: LightRelease
