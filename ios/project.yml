name: Godstone
options:
  bundleIdPrefix: io.godstone
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  LightDebug: debug
  LightRelease: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

packages:
  GodstonePackages:
    path: ./Godstone

targets:
  Godstone:
    type: application
    platform: iOS
    sources:
      - path: Godstone/Sources/App/AppContainer.swift
      - path: Godstone/Sources/App/ArchiveView.swift
      - path: Godstone/Sources/App/GodstoneApp.swift
      - path: Godstone/Sources/App/GodstoneTheme.swift
      - path: Godstone/Sources/App/RootView.swift
      - path: Godstone/PrivacyInfo.xcprivacy
        buildPhase: resources
      # NOTE: The Archive (.db) and model (.gguf) assets are intentionally NOT
      # bundled as static folder resources here. They are mmap'd at runtime via
      # Bundle.main.path(forResource:) keyed off INFOPLIST_KEY_GodstoneArchiveFile
      # / GodstoneModelFile. When an approved asset is absent, the lookup returns
      # nil and the app enters a truthful unavailable/degraded state
      # (ArchiveRepository.isAvailable == false) rather than failing the build.
      # Adding a per-tier Resources/<tier> folder reference caused xcodebuild to
      # emit a CpResource for a nonexistent directory and fail; that reference is
      # removed so the app compiles with zero production content present.
      # A staging task that verifies approved assets (see content/release_gate.py)
      # is the gate before any resource phase is reintroduced.
    dependencies:
      - package: GodstonePackages
        product: GodstoneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.godstone.app
        PRODUCT_NAME: Godstone
        INFOPLIST_FILE: Godstone/Info.plist
        CODE_SIGN_ENTITLEMENTS: Godstone/Godstone.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_GodstoneTier: LIGHT
        INFOPLIST_KEY_GodstoneArchiveFile: archive_light.db
      configs:
        LightDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ARCHIVE_ONLY
        LightRelease:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
          ENABLE_TESTABILITY: NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ARCHIVE_ONLY

schemes:
  Godstone-Light:
    build:
      targets:
        Godstone: all
    run:
      config: LightDebug
    test:
      config: LightDebug
    analyze:
      config: LightRelease
    profile:
      config: LightRelease
    archive:
      config: LightRelease
